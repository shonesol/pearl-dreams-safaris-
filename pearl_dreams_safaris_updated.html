<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pearl dreams safaris</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>

/* ===== BASE ===== *//* ===== BASE ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:#F5F5DC;
color:#111111;
}

/* ===== HEADER ===== */
/* ===== HEADER ===== */
header{
    background:linear-gradient(90deg,#2E7D32,#111111);
    padding:10px 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-content{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:15px;
}

.logo-img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
}

header h1{
    color:#F8F8FF;
    font-size:28px;
    margin:0;
    font-weight:700;
}

.logo-img{
    width:45px;
    height:45px;
    border-radius:50%;
}

/* ===== HERO SLIDER ===== */
.hero-slider{
    width:100%;
    height:70vh;
    min-height:500px;
    background-image:url("8ce977a4-f6bb-4c78-8114-cee0a961f662.jpeg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.hero-slider::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.45);
}

.hero-content{
    position:relative;
    z-index:2;
    text-align:center;
    color:#F8F8FF;
    padding:20px;
}

.hero-content h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero-content p{
    font-size:1.2rem;
    margin-bottom:25px;
}

.hero-btn{
    display:inline-block;
    padding:14px 30px;
    background:#2E7D32;
    color:#F8F8FF;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
}

.hero-btn:hover{
    background:#111111;
}

/* ===== SECTION ===== */
section{
padding:60px 20px;
}

.title{
text-align:center;
color:#2E7D32;
font-size:32px;
margin-bottom:20px;
}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:1100px;
margin:auto;
}

.card{
background:#F8F8FF;
padding:20px;
border-radius:10px;
border-left:5px solid #C9A227;
box-shadow:0 10px 20px rgba(0,0,0,.1);
}

/* ===== FORM ===== */
form{
max-width:600px;
margin:auto;
background:#F8F8FF;
padding:20px;
border-radius:12px;
box-shadow:0 10px 20px rgba(0,0,0,.1);
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
font-weight:800;
color:#F8F8FF;
background:linear-gradient(90deg,#2E7D32,#111111);
cursor:pointer;
}

/* ===== SOCIAL ===== */
.social-icons{
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:18px;
margin-top:35px;
}

.social-icons a{
width:50px;
height:50px;
display:flex;
justify-content:center;
align-items:center;
text-decoration:none;
border-radius:50%;
background:#2E7D32;
color:#F8F8FF;
font-size:22px;
transition:.3s ease;
}

.social-icons a:hover{
background:#111111;
color:#C9A227;
transform:translateY(-5px);
}

/* ===== FOOTER ===== */
footer{
background:grey;
color:#F8F8FF;
padding:40px;
text-align:center;
}

/* VIDEO SECTION */
.video-section{
padding:70px 5%;
background:linear-gradient(180deg,#F5F5DC,#F8F8FF);
}

.video-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
max-width:1200px;
margin:auto;
}

.video-card{
position:relative;
background:#F8F8FF;
border-radius:18px;
overflow:hidden;
border:2px solid #C9A227;
box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.video-card video{
width:100%;
height:240px;
object-fit:cover;
display:block;
}

.video-info{
background:#111;
color:#fff;
padding:15px;
}

.video-info h3{
color:#C9A227;
}

.video-card::before{
content:"▶ LIVE SAFARI";
position:absolute;
top:10px;
left:10px;
background:#2E7D32;
color:#fff;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

/* RESPONSIVE */
@media (max-width:768px){
footer{
padding:40px 20px;
}
}

</style>
</head>

<body>

<header>
<h1>PEARL DREAMS SAFARIS</h1>
</header>

<section class="hero-slider">
<div class="hero-content">
<h1>Discover Nature</h1>
<p>Crafting unforgettable safari experiences</p>
<a class="hero-btn" href="#">Explore Tours</a>
</div>
</section>

<!-- VIDEO SECTION ADDED -->
<section class="video-section">
<h2 class="title">Safari Video Experience</h2>

<div class="video-grid">

<div class="video-card">
<video autoplay muted loop playsinline preload="auto">
<source src="video1.mp4" type="video/mp4">
</video>
<div class="video-info">
<h3>Gorilla Trekking</h3>
</div>
</div>

<div class="video-card">
<video autoplay muted loop playsinline preload="auto">
<source src="video2.mp4" type="video/mp4">
</video>
<div class="video-info">
<h3>Game Drives</h3>
</div>
</div>

</div>
</section>

</body>
</html>
