<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --green:#2E7D32;
    --orange:#F57C00;
    --gold:#D4AF37;
    --beige:#FFF8E6;
    --dark:#1B1B1B;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:var(--beige);
    color:var(--dark);
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 15px;
    background:linear-gradient(90deg,var(--green),var(--orange));
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
}

.menu{
    font-size:24px;
    cursor:pointer;
}

.logo{
    width:40px;
    border-radius:50%;
    border:2px solid var(--gold);
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    left:-260px;
    top:0;
    width:250px;
    height:100%;
    background:linear-gradient(var(--green),var(--orange));
    padding:20px;
    transition:0.4s;
    z-index:2000;
}

.sidebar a{
    display:block;
    color:white;
    padding:10px;
    margin:8px 0;
    text-decoration:none;
    background:rgba(255,255,255,0.15);
    border-radius:6px;
}

.sidebar.open{left:0;}

/* HERO */
.hero{
    height:70vh;
    background:url("0aff6cce-daf8-4817-87db-92309cc022ba.jpeg") center/cover;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    position:relative;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.5);
}

.hero div{position:relative;}

.btn{
    display:inline-block;
    padding:12px 20px;
    background:linear-gradient(90deg,var(--green),var(--orange));
    color:white;
    border-radius:30px;
    text-decoration:none;
}

/* SECTIONS */
section{padding:50px 20px;}
h2{text-align:center;color:var(--orange);margin-bottom:20px;}

/* SLIDER */
.slider{
    display:flex;
    overflow:hidden;
    max-width:900px;
    margin:auto;
}

.track{
    display:flex;
    transition:0.5s ease;
}

.slide{
    min-width:100%;
    background:white;
    padding:20px;
    border-left:5px solid var(--gold);
}

/* FORM */
form{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ddd;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    background:linear-gradient(90deg,var(--green),var(--orange));
    color:white;
    font-weight:bold;
    border-radius:6px;
}

/* SOCIAL */
.social-icons{
    display:flex;
    justify-content:center;
    gap:15px;
}

.social-icons i{
    font-size:30px;
    color:var(--green);
    transition:0.3s;
}

.social-icons i:hover{
    color:var(--gold);
    transform:scale(1.2);
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    background:var(--dark);
    color:white;
}
</style>

emailjs.init("YOUR_PUBLIC_KEY");
</script>
  
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <a href="#home">Home</a>
    <a href="#destinations">Destinations</a>
    <a href="#gallery">Gallery</a>
    <a href="#booking">Booking</a>
</div>

<!-- HEADER -->
<header>
    <div class="menu" onclick="toggleMenu()">☰</div>
    <h3>Pearl Dreams</h3>
    <img src="logo.png" class="logo">
</header>

<!-- HERO -->
<div class="hero" id="home">
    <div>
        <h1>Discover East Africa</h1>
        <p>Uganda • Kenya • Tanzania • Rwanda</p>
        <a href="#booking" class="btn">Plan Safari</a>
    </div>
</div>

<!-- DESTINATIONS -->
<section id="destinations">
<h2>Top Destinations</h2>

<div class="slider">
<div class="track" id="destTrack">

<div class="slide">🦍 Bwindi Gorilla Trekking</div>
<div class="slide">🐘 Maasai Mara Migration</div>
<div class="slide">🦓 Serengeti Plains</div>
<div class="slide">🦍 Volcanoes Rwanda</div>

</div>
</div>
</section>

<!-- GALLERY -->
<section id="gallery">
<h2>Gallery</h2>

<div class="slider">
<div class="track" id="galleryTrack">

<div class="slide"><img src="3b9198fe-0483-40fa-8c7d-fb7706cdde46.jpeg" width="100%"></div>
<div class="slide"><img src="36f95f26-015b-4c1b-8a22-cfe14fe0bd13.jpeg" width="100%"></div>
<div class="slide"><img src="7320a1c5-07e1-46a4-9658-1c8a209a1e8e.jpeg" width="100%"></div>

</div>
</div>
</section>

<!-- BOOKING -->
<section id="booking">
<h2>Booking</h2>

<form id="bookingForm">
<input name="name" placeholder="Full Name" required>
<input name="email" placeholder="Email" required>
<input name="phone" placeholder="Phone" required>
<textarea name="message" placeholder="Safari details..." required></textarea>

<button type="submit">Send Booking</button>
</form>
</section>

<!-- REVIEWS -->
<section>
<h2>Reviews</h2>

<input id="rName" placeholder="Name">
<select id="rRating">
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
</select>
<textarea id="rComment" placeholder="Review"></textarea>

<button onclick="submitReview()">Submit Review</button>

<div id="reviewBox"></div>
</section>

<!-- SOCIAL -->
<section>
<h2>Connect</h2>

<div class="social-icons">
<a href="https://wa.me/256702094292"><i class="fab fa-whatsapp"></i></a>
<a href="https://instagram.com"><i class="fab fa-instagram"></i></a>
<a href="https://facebook.com"><i class="fab fa-facebook"></i></a>
</div>
</section>

<!-- FOOTER -->
<footer>
<p>&copy; <span id="year"></span> Pearl Dreams Safaris</p>
</footer>

<script>

// MENU
function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("open");
}

// YEAR
document.getElementById("year").innerText = new Date().getFullYear();


// EMAILJS BOOKING
document.getElementById("bookingForm").addEventListener("submit", function(e){
    e.preventDefault();

    let data = this;

    emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{
        name:data.name.value,
        email:data.email.value,
        phone:data.phone.value,
        message:data.message.value
    });

    let msg = `Booking:
Name:${data.name.value}
Email:${data.email.value}
Phone:${data.phone.value}
Message:${data.message.value}`;

    window.open("https://wa.me/256702094292?text=" + encodeURIComponent(msg));

    alert("Booking sent!");
});


// REVIEWS
function submitReview(){

    let name = document.getElementById("rName").value;
    let rating = document.getElementById("rRating").value;
    let comment = document.getElementById("rComment").value;

    document.getElementById("reviewBox").innerHTML += `
        <div class="slide">
            <h3>${name}</h3>
            <p>${"⭐".repeat(rating)}</p>
            <p>${comment}</p>
        </div>
    `;

    emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{
        name:name,
        rating:rating,
        comment:comment
    });

    let msg = `Review:
Name:${name}
Rating:${rating}
Comment:${comment}`;

    window.open("https://wa.me/256702094292?text=" + encodeURIComponent(msg));
}


// SLIDERS
function autoSlide(id){
    let track = document.getElementById(id);
    let index = 0;

    setInterval(()=>{
        index++;
        if(index >= track.children.length) index = 0;
        track.style.transform = `translateX(-${index * 100}%)`;
    },3000);
}

autoSlide("destTrack");
autoSlide("galleryTrack");

</script>

</body>
</html>
